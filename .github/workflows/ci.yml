name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test -race -short ./...
      - name: Performance fixture smoke test
        run: go test ./hub ./models ./database ./cache -run '^TestPerformance' -bench '^Benchmark' -benchtime=1x -count=1
      - name: PostgreSQL integration tests
        run: go test -race -p 2 -tags integration -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Format lint
        run: test -z "$(git ls-files '*.go' | grep -v '^.go/' | xargs gofmt -l)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t quiz-postgres-migration:local .
      - name: Fresh installation, recreation and restore
        run: scripts/smoke-postgres.sh quiz-postgres-migration:local
