name: Publish and stage deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Select deployment channel
        id: deployment
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$SOURCE_BRANCH" == "main" ]]; then
            channel="prod"
            branch="deploy-prod"
          else
            channel="dev"
            branch="deploy-dev"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Linux AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.deployment.outputs.image }}:${{ steps.deployment.outputs.channel }}
            ${{ steps.deployment.outputs.image }}:${{ steps.deployment.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish deployment controller
        if: github.event.workflow_run.head_branch == 'main'
        uses: docker/build-push-action@v6
        with:
          context: ./deploy-control
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.deployment.outputs.image }}:control
            ${{ steps.deployment.outputs.image }}:control-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=deploy-control
          cache-to: type=gha,mode=max,scope=deploy-control

      # Portainer polls this generated branch. Moving it only after the image is
      # published prevents Portainer from deploying the previous channel image.
      - name: Mark the image ready for Portainer
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ steps.deployment.outputs.branch }}
          IMAGE: ${{ steps.deployment.outputs.image }}
          CHANNEL: ${{ steps.deployment.outputs.channel }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf 'image=%s:%s\nsource=%s\n' "$IMAGE" "$CHANNEL" "$SOURCE_SHA" > .portainer-deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .portainer-deployment
          git commit -m "Deploy ${CHANNEL} ${SOURCE_SHA} [skip ci]"
          git push --force origin "HEAD:refs/heads/${DEPLOY_BRANCH}"

      - name: Trigger immediate NAS deployment
        if: env.CONTROL_URL != '' && env.CONTROL_TOKEN != ''
        shell: bash
        env:
          CONTROL_URL: ${{ secrets.DEPLOY_CONTROL_URL }}
          CONTROL_TOKEN: ${{ secrets.DEPLOY_CONTROL_TOKEN }}
          ENVIRONMENT: ${{ steps.deployment.outputs.channel }}
          IMAGE_TAG: ${{ steps.deployment.outputs.sha_tag }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${CONTROL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"tag\":\"${IMAGE_TAG}\"}" \
            "${CONTROL_URL}/v1/environments/${ENVIRONMENT}/deploy"
