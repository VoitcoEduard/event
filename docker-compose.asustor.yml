# Fresh production stack for the AS6704T. Database and media use new folders.
services:
  postgres:
    image: postgres:18.6
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the PostgreSQL administrator password}
      POSTGRES_DB: postgres
      APP_DB_NAME: quiz_prod
      APP_DB_USER: quiz_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set the application database password}
    volumes:
      - /volume1/Docker/quiz-prod/postgresql:/var/lib/postgresql
      - ./deploy/postgres/10-create-app.sh:/docker-entrypoint-initdb.d/10-create-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private]

  app:
    image: ${APP_IMAGE:?Set the GitHub release image}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: production
      AUTH_MODE: google
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the HTTPS public origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set Google OAuth client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set Google OAuth client secret}
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL connection URL}
      MEDIA_ROOT: /app/data/media
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
    volumes:
      - /volume1/Docker/quiz-prod/media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      private: {}
      edge:
        aliases: [quiz-prod-web]

networks:
  private:
    internal: true
  edge:
    external: true
    name: edge
