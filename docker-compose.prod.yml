# Generic production stack with private PostgreSQL and a Cloudflare tunnel.
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the PostgreSQL administrator password}
      POSTGRES_DB: postgres
      APP_DB_NAME: quiz_prod
      APP_DB_USER: quiz_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set the application database password}
    volumes:
      - postgres_data_prod:/var/lib/postgresql
      - ./deploy/postgres/10-create-app.sh:/docker-entrypoint-initdb.d/10-create-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private]
  app:
    image: ${APP_IMAGE:?Set the authenticated release image}
    platform: linux/amd64
    restart: unless-stopped
    pull_policy: always
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      MEDIA_ROOT: /app/data/media
      APP_ENV: production
      AUTH_MODE: google
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the HTTPS public origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set Google OAuth client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set Google OAuth client secret}
    volumes:
      - media_data_prod:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, edge]
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set the Cloudflare tunnel token}
    networks: [edge]
volumes:
  postgres_data_prod:
  media_data_prod:
networks:
  private:
    internal: true
  edge: {}
