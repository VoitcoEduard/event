version: '3.8'

# ─────────────────────────────────────────────
#  PRODUCTION  (Asustor NAS / Portainer stack)
#  MongoDB runs as a SEPARATE container/stack.
#  Usage: docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────

services:

  app:
    # Use an authenticated release image pinned by tag or digest.
    image: ${APP_IMAGE:?Set the authenticated release image}
    container_name: go_server_app
    restart: always
    pull_policy: always
    # Force AMD64 — prevents "exec format error" on the Asustor NAS (Intel Celeron)
    platform: linux/amd64
    environment:
      PORT: 8080
      # Point to your separate MongoDB container.
      # Replace "mongo" with the actual container name or IP if on a different network.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:?Set the production database name}
      APP_ENV: production
      AUTH_MODE: google
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the HTTPS public origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set Google OAuth client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set Google OAuth client secret}
    ports:
      - "8080:8080"
    networks:
      - game_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN} # set in .env or Portainer env vars
    networks:
      - game_net

networks:
  game_net:
    driver: bridge
