# Local development: docker compose up --build
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set the development PostgreSQL administrator password}
      POSTGRES_DB: postgres
      APP_DB_NAME: quiz_dev
      APP_DB_USER: quiz_app
      APP_DB_PASSWORD: ${DEV_APP_DB_PASSWORD:?Set the development application database password}
    volumes:
      - postgres_data_dev:/var/lib/postgresql
      - ./deploy/postgres/10-create-app.sh:/docker-entrypoint-initdb.d/10-create-app.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [game_net]
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: ${DEV_DATABASE_URL:?Set the development PostgreSQL URL}
      MEDIA_ROOT: /app/data/media
      APP_ENV: development
      AUTH_MODE: dev
      PUBLIC_BASE_URL: http://localhost:8081
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:?Set a development password}
    volumes:
      - media_data_dev:/app/data/media
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [game_net]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_BACKEND_TARGET: http://app:8080
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [game_net]
volumes:
  postgres_data_dev:
  media_data_dev:
networks:
  game_net:
    driver: bridge
